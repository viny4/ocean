  float body = smoothstep(w, w * 0.35, abs(lx)) * smoothstep(1.05, 0.6, u);
  vec2 g = vec2(lx, ly - age * size * 0.7) * 4.0 / size;
  float n = noise(g) * 0.6 + noise(g * 2.7 + 9.0) * 0.4;
  float a = body * smoothstep(0.4, 0.65, n + 0.3 * (1.0 - u));
  // churned white water around the foot
  float foot = smoothstep(spread * 1.8, spread * 0.5, abs(lx)) * smoothstep(size * 0.55, 0.0, ly);
  a = max(a, foot * (0.65 + 0.45 * noise(g * 1.7 + 3.0)));
  a *= pow(1.0 - k, 1.3);
  float back = max(dot(rd, SUN), 0.0);                             // spray glows with the sun behind it
  vec3 c = vec3(0.95) * (SKY_AMB * 0.7 + SUN_COL * (0.5 + 0.6 * back * back));
  tS = t;
  return vec4(c, clamp(a, 0.0, 1.0));
}

// a whale's blow: a bushy plume of mist that rises, drifts downwind and thins out
vec4 blowMist(vec3 ro, vec3 rd, vec3 S, float size, float age, out float tS) {
  tS = 1e5;
  if (age < 0.0 || age > 6.0) return vec4(0.0);
  vec2 v = S.xz - ro.xz;
  float D = length(v);
  vec2 nB = v / D;
  float den = dot(rd.xz, nB);
  if (den < 0.05) return vec4(0.0);
  float t = D / den;
  vec3 P = ro + rd * t;
  vec2 side = vec2(-nB.y, nB.x);
  float H = 6.0 * size * (1.0 - exp(-age * 3.0));
  float ly = P.y - S.y;
  vec2 wd = vec2(cos(uWave.z), sin(uWave.z));
  float lx = dot(P.xz - S.xz, side) - dot(wd, side) * ly * 0.12 * age;   // leaning downwind
  if (ly < 0.0 || ly > H + 3.0 || abs(lx) > 6.0) return vec4(0.0);
  float w = 0.35 + ly * 0.42 + age * 0.45;                          // a bushy V, widening as it rises
  float body = exp(-lx * lx / (w * w) * 2.0) * smoothstep(H + 2.0, H * 0.6, ly) * smoothstep(0.0, 0.5, ly);
  vec2 g = vec2(lx, ly - age * 0.6) * 1.4;
  float a = body * (0.55 + 0.45 * noise(g) + 0.2 * noise(g * 3.1)) * smoothstep(0.0, 0.25, age) * exp(-age * 0.55) * 0.9;
  vec3 c = vec3(0.92, 0.94, 0.96) * (SKY_AMB * 0.75 + SUN_COL * (0.45 + 0.5 * pow(max(dot(rd, SUN), 0.0), 4.0)));
  tS = t;
  return vec4(c, clamp(a, 0.0, 1.0));
}

// an expanding ring of foam with a churned middle where something broke the surface
float foamRing(vec2 d, float age, float size) {
  float life = 1.6 + size * 0.6;
  if (age < 0.0 || age > life) return 0.0;
  float k = age / life;
  float r = length(d) / size;
  float R = 0.6 + 1.6 * k;
  return (exp(-pow((r - R) / 0.28, 2.0)) * 0.8 + exp(-r * r * 2.5) * (1.0 - k)) * (1.0 - k);
}

// white water on the sea where the animals break the surface, and a shark's wake
float faunaFoam(vec2 p) {
  if (uFauna.z < 0.01) return 0.0;
  float f = 0.0;
  if (uDolphin.w >= 0.0 && length(p - podCentre()) < 16.0) {
    vec2 dir = vec2(cos(uDolphin.z), sin(uDolphin.z));
    for (int i = 0; i < 4; i++) {
      vec3 P;
      float pitch, tau;
      if (!dolphin(i, P, pitch, tau)) continue;
      f = max(f, foamRing(p - (P.xz - dir * POD_SPEED * tau), tau, 0.7));
      f = max(f, foamRing(p - (P.xz + dir * POD_SPEED * (LEAP_AIR - tau)), tau - LEAP_AIR, 0.7));
    }
  }
  if (uWhale.w >= 0.0 && length(p - uWhale.xy) < 30.0) {
    vec3 P;
    float pitch, roll, a1, a2;
    vec4 s1, s2;
    whaleState(P, pitch, roll, s1, a1, s2, a2);
    if (uFauna.y < 0.5) {
      f = max(f, foamRing(p - s1.xz, a1, s1.w));
      f = max(f, foamRing(p - s2.xz, a2, s2.w));
    } else {
      // a slick of churned water around the back while it is up, and where the flukes went down
      vec2 dir = vec2(cos(uWhale.z), sin(uWhale.z));
      vec2 q = p - P.xz;
      vec2 lq = vec2(dot(q, dir), dot(q, vec2(-dir.y, dir.x)));
      f = max(f, smoothstep(1.0, 0.5, length(lq / vec2(7.0, 2.2))) * 0.45 * smoothstep(-2.6, -1.4, P.y));
      vec2 fl = uWhale.xy + dir * (2.0 * 10.2 - 12.0 - 3.0);
      f = max(f, foamRing(p - fl, uWhale.w - 10.2, 2.5));
    }
  }
  if (uShark.w > 0.01) {
    // a V of ripples spreading back from the fin
    vec2 dir = vec2(cos(uShark.z), sin(uShark.z));
    vec2 q = p - uShark.xy - dir * 0.8;
    float along = -dot(q, dir), across = abs(dot(q, vec2(-dir.y, dir.x)));
    float vee = exp(-pow((across - 0.08 - along * 0.33) / 0.09, 2.0)) * step(-0.3, along) * smoothstep(7.0, 0.0, along);
    f = max(f, (vee * 0.8 + exp(-dot(q, q) * 8.0) * 0.7) * uShark.w);
  }
  return clamp(f * (0.6 + 0.6 * noise(p * 5.0)), 0.0, 1.0);
}

// wet, shiny hide: sunlight, sky, a glint and a little rim of reflected sky
vec3 hide(vec3 n, vec3 rd, vec3 base) {
  float dif = max(dot(n, SUN), 0.0);
  float spec = pow(max(dot(reflect(rd, n), SUN), 0.0), 40.0);
  float fres = pow(1.0 - max(dot(n, -rd), 0.0), 4.0);
  return base * (SUN_COL * dif * 0.9 + SKY_AMB * (0.22 + 0.3 * (0.5 + 0.5 * n.y))) + SUN_COL * spec * 0.7 + SKY_AMB * fres * 0.12;
}

void wildlife(vec3 ro, vec3 rd, vec3 horizon, inout vec3 col, inout float hitT) {
  float amt = clamp(uFauna.z * 2.0, 0.0, 1.0);
  float bestT = 1e5, bestC = 0.0;
  vec3 bestP = vec3(0.0), bestN = vec3(0.0, 1.0, 0.0);
  mat3 bestB = mat3(1.0);
  int bestK = 0;
  float cv, tt;
  vec3 lp, nl;
  vec3 P;
  float pitch, roll, tau;

  // the pod, inside one sphere around them all first
  bool podSeen = false;
  if (uDolphin.w >= 0.0) {
    vec2 pc = podCentre();
    vec3 oc = ro - vec3(pc.x, 0.0, pc.y);
    float b = dot(oc, rd);
    podSeen = b < 0.0 && b * b - dot(oc, oc) + 120.0 > 0.0;
  }
  if (podSeen) {
    for (int i = 0; i < 4; i++) {
      if (!dolphin(i, P, pitch, tau) || tau < -0.45 || tau > LEAP_AIR + 0.45) continue;
      mat3 B = creatureBasis(uDolphin.z, pitch, 0.0);
      tt = marchCreature(ro, rd, P, B, 1.4, 0, uTime * 9.0 + float(i) * 2.0, hitT, cv, lp, nl);
      if (cv > 0.0 && tt < bestT) { bestT = tt; bestC = cv; bestP = lp; bestN = nl; bestB = B; bestK = 0; }
    }
  }
  vec4 s1, s2;
  float a1 = -1.0, a2 = -1.0;
  if (uWhale.w >= 0.0) {
    whaleState(P, pitch, roll, s1, a1, s2, a2);
    if (P.y > -9.5) {
      mat3 B = creatureBasis(uWhale.z, pitch, roll);
      tt = marchCreature(ro, rd, P, B, 8.6, 1, uTime * 1.3, hitT, cv, lp, nl);
      if (cv > 0.0 && tt < bestT) { bestT = tt; bestC = cv; bestP = lp; bestN = nl; bestB = B; bestK = 1; }
    }
  }
  if (uShark.w > 0.01) {
    P = vec3(uShark.x, -0.15 - (1.0 - uShark.w) * 0.75 + 0.06 * sin(uTime * 0.9), uShark.y);
    mat3 B = creatureBasis(uShark.z, 0.0, 0.0);
    tt = marchCreature(ro, rd, P, B, 1.35, 2, uTime * 2.6, hitT, cv, lp, nl);
    if (cv > 0.0 && tt < bestT) { bestT = tt; bestC = cv; bestP = lp; bestN = nl; bestB = B; bestK = 2; }
  }

  if (bestC > 0.0) {
    vec3 n = normalize(bestB * bestN);
    vec3 base;
    if (bestK == 0) {
      // grey back, pale belly
      base = mix(vec3(0.78, 0.78, 0.76), vec3(0.3, 0.33, 0.38), smoothstep(-0.12, 0.05, bestP.y + 0.04 * bestP.z));
    } else if (bestK == 1) {
      // black humpback, white flippers and fluke undersides, grooved pale throat
      float ax = abs(bestP.x);
      float white = max(smoothstep(1.4, 2.0, ax) * step(bestP.z, 4.5) * step(bestP.y, -0.2), smoothstep(-0.3, -0.8, bestN.y) * step(bestP.z, -6.0));
      float throat = smoothstep(-0.6, -1.2, bestP.y) * step(1.5, bestP.z) * (0.6 + 0.4 * step(0.5, fract(bestP.x * 2.5)));
      base = mix(vec3(0.07, 0.075, 0.09), vec3(0.78, 0.78, 0.76), max(white, throat * 0.7));
      base *= 0.88 + 0.24 * noise(vec2(bestP.z * 1.3, bestP.y * 1.7 + bestP.x));       // scars and barnacles
    } else {
      base = vec3(0.34, 0.37, 0.4) * (1.0 - 0.35 * smoothstep(0.3, 0.55, bestP.y));
    }
    vec3 c = hide(n, rd, base);
    c = mix(c, horizon, 1.0 - exp(-bestT * 0.0022));
    col = mix(col, c, bestC * amt);
    if (bestC > 0.5) hitT = bestT;
  }

  // splashes as they leap out and dive back in, the whale's crash or its blows
  float tS;
  vec4 s;
  if (podSeen) {
    vec2 dir = vec2(cos(uDolphin.z), sin(uDolphin.z));
    for (int i = 0; i < 4; i++) {
      if (!dolphin(i, P, pitch, tau)) continue;
      vec2 e0 = P.xz - dir * POD_SPEED * tau, e1 = P.xz + dir * POD_SPEED * (LEAP_AIR - tau);
      s = spray(ro, rd, vec3(e0.x, 0.0, e0.y), 0.55, tau, tS);
      if (s.a > 0.0 && tS < hitT + 1.0) col = mix(col, s.rgb, s.a * amt);
      s = spray(ro, rd, vec3(e1.x, 0.0, e1.y), 0.7, tau - LEAP_AIR, tS);
      if (s.a > 0.0 && tS < hitT + 1.0) col = mix(col, s.rgb, s.a * amt);
    }
  }
  if (uWhale.w >= 0.0) {
    float haze = 1.0 - exp(-length(uWhale.xy - ro.xz) * 0.0022);
    if (uFauna.y < 0.5) {
      s = spray(ro, rd, s1.xyz, s1.w, a1, tS);
      if (s.a > 0.0 && tS < hitT + 3.0) col = mix(col, mix(s.rgb, horizon, haze), s.a * amt);
      s = spray(ro, rd, s2.xyz, s2.w, a2, tS);
      if (s.a > 0.0 && tS < hitT + 8.0) col = mix(col, mix(s.rgb, horizon, haze), s.a * amt);
    } else {
      s = blowMist(ro, rd, s1.xyz, s1.w, a1, tS);
      if (s.a > 0.0 && tS < hitT + 2.0) col = mix(col, mix(s.rgb, horizon, haze), s.a * amt);
      s = blowMist(ro, rd, s2.xyz, s2.w, a2, tS);
      if (s.a > 0.0 && tS < hitT + 2.0) col = mix(col, mix(s.rgb, horizon, haze), s.a * amt);
    }
  }
}

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void camBasis(vec2 look, out vec3 f, out vec3 r, out vec3 u) {
  f = vec3(sin(look.x) * cos(look.y), sin(look.y), cos(look.x) * cos(look.y));
  r = normalize(cross(vec3(0, 1, 0), f));
  u = cross(f, r);
}

// lighting from sun height and weather: warm near the horizon, dark at night,
// dimmed by storm clouds and fog, lit up by lightning
void setupLighting() {
  SUN = uSun;
  float el = SUN.y;
  float gloom = uWeather.z;
  DAY = smoothstep(-0.15, 0.15, el);
  vec3 tint = mix(vec3(1.0, 0.42, 0.12), vec3(1.0, 0.95, 0.85), smoothstep(0.0, 0.35, el));
  SUN_COL = tint * smoothstep(-0.03, 0.03, el) * mix(0.7, 1.0, smoothstep(0.0, 0.3, el));
  SUN_COL *= (1.0 - gloom * 0.85) * exp(-uWeather.y * 40.0);
  SKY_AMB = mix(vec3(0.03, 0.04, 0.08), vec3(1.0), DAY) * (1.0 - gloom * 0.5);
  SKY_AMB += uWeather.w * vec3(0.55, 0.6, 0.75);
  // dust storms turn all the light ochre
  SUN_COL *= mix(vec3(1.0), vec3(1.0, 0.72, 0.45), uPrecip.z);
  SKY_AMB *= mix(vec3(1.0), vec3(1.0, 0.8, 0.58), uPrecip.z * 0.85);
  // the moon hangs low, roughly opposite the sun
  float mAz = atan(SUN.x, SUN.z) + 2.6;
  MOON = uMoon.w > 0.5 ? uMoon.xyz : normalize(vec3(sin(mAz), 0.22, cos(mAz)));
  MOON_COL = vec3(0.62, 0.72, 0.92) * (1.0 - DAY) * (1.0 - gloom * 0.95) * 0.4 * (0.12 + 0.88 * uStars.x)
           * smoothstep(-0.02, 0.05, MOON.y);
  PX = 1.0 / (1.4 * uRes.y);
}

#ifdef CLOUD_PASS
// Clouds are marched at half resolution with a fresh random offset every frame and
// blended with the previous frames, re-aimed to where the camera points now: the
// dithering noise averages away into smooth clouds that stay put as you look around.
void main() {
  setupLighting();
  vec2 frag = gl_FragCoord.xy;
  vec3 ro = uPos;
  RO = ro;
  vec3 f, r, u;
  camBasis(uLook, f, r, u);
  vec2 uv = (frag - 0.5 * uCloudRes) / uCloudRes.y;
  vec2 jit = (vec2(hash(vec2(uCloudView.z, 3.7)), hash(vec2(uCloudView.z, 8.1))) - 0.5) / uCloudRes.y;
  vec3 rd = normalize((uv.x + jit.x) * r + (uv.y + jit.y) * u + 1.4 * f);
  vec4 cl = vec4(0.0, 0.0, 0.0, 1.0);
  if (ro.y > 0.0 && rd.y > 0.0 && fogAmount(ro, rd, 1e5) < 0.995)
    cl = cloudMarch(ro, rd, fract(hash(frag) + uCloudView.z * 0.618034));
  vec4 enc = vec4(cl.rgb / (1.0 + cl.rgb), cl.a);

  // where was this direction on screen last frame?
  vec3 pf, pr, pu;
  camBasis(uCloudView.xy, pf, pr, pu);
  vec3 rd0 = normalize(uv.x * r + uv.y * u + 1.4 * f);
  float z = dot(rd0, pf);
  if (uCloudView.w > 0.5 && z > 0.0) {
    vec2 tc = (1.4 * vec2(dot(rd0, pr), dot(rd0, pu)) / z * uCloudRes.y + 0.5 * uCloudRes) / uCloudRes;
    if (tc.x > 0.0 && tc.y > 0.0 && tc.x < 1.0 && tc.y < 1.0) {
      float k = mix(0.12, 0.8, clamp(uWeather.w, 0.0, 1.0)); // lightning must not lag behind
      enc = mix(texture2D(uTex, tc), enc, k);
    }
  }
  gl_FragColor = enc;
}
#else
void main() {
  setupLighting();
  float el = SUN.y;
  float gloom = uWeather.z;

  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float t = uTime;

  vec3 ro = uPos + vec3(0.0, 0.08 * sin(t * 0.6), 0.0);
  RO = ro;
  vec3 f, r, u;
  camBasis(uLook, f, r, u);
  vec3 rd = normalize(uv.x * r + uv.y * u + 1.4 * f);

  if (ro.y < 0.0) {
    // diving: a world of its own
    vec3 uc = aces(underwaterView(ro, rd, t) * uSky.z);
    vec2 qv = gl_FragCoord.xy / uRes;
    uc *= 0.8 + 0.2 * pow(16.0 * qv.x * qv.y * (1.0 - qv.x) * (1.0 - qv.y), 0.3);
    gl_FragColor = vec4(uc, 1.0);
    return;
  }

  vec3 horizon = skyBase(normalize(vec3(rd.x, 0.0, rd.z)), false);
  vec3 col;
  vec3 boltCol = vec3(0.0);
  float hitT = 1e5;

  if (rd.y >= -0.0005) {
    if (fogAmount(ro, rd, hitT) > 0.995) col = horizon;
    else {
      // clouds come from the smoothed half-resolution cloud pass
      vec4 cl = texture2D(uTex, gl_FragCoord.xy / uRes);
      col = skyBase(rd, true) * cl.a + cl.rgb / max(1.0 - cl.rgb, 0.001);
    }
    boltCol = lightningBolt(ro, rd);
  } else {
    // intersect the wavy surface (plane + refinement)
    float tw = -ro.y / rd.y;
    vec3 w;
    for (int i = 0; i < 3; i++) {
      vec3 p = ro + rd * tw;
      w = waves(p.xz, t, tw);
      tw = (min(w.x, ro.y - 0.1) - ro.y) / rd.y; // never behind the camera on grazing rays
    }
    vec3 p = ro + rd * tw;
    float dist = tw;
    hitT = dist;
    w = waves(p.xz, t, dist);
    vec3 n = normalize(vec3(-w.y, 1.0, -w.z));
    float crest = CREST;

    // raindrop and hailstone rings near the camera
    float drops = max(uWeather.x, uPrecip.y);
    float splash = 0.0;
    if (drops > 0.001 && dist < 40.0) {
      vec3 rp = rainRipples(p.xz, t);
      float nf = 1.0 - smoothstep(10.0, 40.0, dist);
      vec2 rg = rp.xy * drops * 0.35 * nf;
      n = normalize(n + vec3(rg.x, 0.0, rg.y));
      splash = clamp(rp.z * uPrecip.y * nf, 0.0, 1.0);
    }

    // reflection
    vec3 rf = reflect(rd, n);
    rf.y = abs(rf.y);
    vec3 refl = skyReflect(p, rf);
    refl = mix(refl, fogColor(rf), fogAmount(p, rf, 1e5)); // in fog or dust the sea mirrors the murk
    float shadow = cloudShadow(p);
    float sd = max(dot(rf, SUN), 0.0);
    float spec = (pow(sd, 900.0) * 40.0 + pow(sd, 120.0) * 1.2) * (1.0 - shadow);

    // refraction into the water
    vec3 rr = refract(rd, n, 1.0 / 1.333);
    float d = floorDepth(p.xz);
    float tf = d / -rr.y;
    for (int i = 0; i < 2; i++) {
      vec3 q = p + rr * tf;
      d = floorDepth(q.xz);
      tf = d / -rr.y;
    }
    vec3 q = p + rr * tf;
    vec3 light = SUN_COL * 0.85 * smoothstep(-0.02, 0.4, el) + SKY_AMB * 0.2;
    vec3 floorCol = seaFloor(q.xz, d, dist) * light * (1.0 - 0.45 * shadow);

    float murk = uWater.y;
    float pathLen = tf + d * 1.15;                 // view path + sunlight path down
    vec3 absorb = vec3(0.36, 0.068, 0.045) * murk;
    vec3 T = exp(-absorb * pathLen);
    vec3 deep = mix(vec3(0.0, 0.10, 0.20), vec3(0.02, 0.14, 0.14), smoothstep(1.0, 3.0, murk) * 0.6);
    deep *= SKY_AMB * 0.6 + light * 0.4;
    vec3 refr = floorCol * T + deep * (1.0 - T);
    refr = mix(refr, deep * 1.1, smoothstep(40.0, 260.0, dist));

    float cosi = max(dot(n, -rd), 0.0);
    float F = 0.02 + 0.98 * pow(1.0 - cosi, 5.0);
    col = mix(refr, refl, F);

    // light glowing through thin wave crests, strongest when looking toward the sun
    float back = pow(max(dot(normalize(rd.xz), normalize(SUN.xz + 1e-4)), 0.0), 3.0);
    col += vec3(0.05, 0.42, 0.36) * SUN_COL * crest * crest * (0.15 + back) * 0.5 * (1.0 - F);

    // whitecaps on crests once the wind picks up; only some crests break
    float windF = smoothstep(4.0, 12.0, uWater.w);
    float breakers = smoothstep(0.55, 0.8, noise(p.xz * 0.045 + vec2(t * 0.04, 0.0)) + windF * 0.3 - 0.15);
    float tex = fbm(p.xz * 2.2 + vec2(t * 0.35, 0.0)) * 0.75 + noise(p.xz * 9.0 - t) * 0.25;
    float foam = crest * breakers * windF * uWater.x;
    foam = clamp(foam * smoothstep(0.42, 0.62, tex) * 1.5, 0.0, 1.0);
    // long foam streaks blown along the wind in a gale
    if (uWater.w > 9.0) {
      vec2 wdir = vec2(cos(uWave.z), sin(uWave.z));
      vec2 wq = vec2(dot(p.xz, wdir), dot(p.xz, vec2(-wdir.y, wdir.x)));
      float streaks = smoothstep(0.62, 0.85, fbm(wq * vec2(0.08, 2.4) - vec2(t * 0.6, 0.0)));
      streaks *= smoothstep(0.4, 0.65, tex); // broken up, not solid bands
      foam = max(foam, streaks * smoothstep(9.0, 16.0, uWater.w) * 0.35 * uWater.x);
    }
    foam *= 1.0 - smoothstep(60.0, 400.0, dist);
    foam = max(foam, splash);
    foam = max(foam, faunaFoam(p.xz) * clamp(uFauna.z * 2.0, 0.0, 1.0));
    vec3 foamCol = vec3(0.92) * (SUN_COL * max(el, 0.0) * 1.2 + SKY_AMB * 0.55);
    col = mix(col, foamCol, foam);
    col += SUN_COL * spec * (1.0 - foam);

    // moonlight path on the water
    float md = max(dot(rf, MOON), 0.0);
    col += MOON_COL * (pow(md, 1400.0) * 30.0 + pow(md, 120.0) * 0.8) * (1.0 - foam);

    // glowing plankton lights up wherever the water is stirred, after dark
    float bio = uNight.y * (1.0 - DAY);
    if (bio > 0.01) {
      // only some crests flare up, broken into flecks; plus scattered pinpricks
      float patchy = smoothstep(0.55, 0.8, noise(p.xz * 0.06 + vec2(t * 0.05, 3.0)));
      float stir = foam * 2.0 + crest * patchy * smoothstep(0.55, 0.8, tex) + splash;
      float spark = smoothstep(0.9, 0.98, noise(p.xz * 7.0 + t * 0.5)) * smoothstep(0.2, 0.8, crest + 0.3 * patchy);
      col += vec3(0.05, 0.6, 1.0) * (stir * 0.7 + spark * 0.5) * bio * (1.0 - smoothstep(15.0, 180.0, dist));
    }

    // aerial haze toward the horizon
    col = mix(col, horizon, 1.0 - exp(-dist * 0.0022));
  }

  // the island and its lighthouse
  float hb = lighthouseBase();
  float tI;
  vec4 isl = island(ro, rd, horizon, tI);
  if (isl.a > 0.0 && tI < hitT) { col = isl.rgb; hitT = tI; }
  float tL;
  vec4 lh = lighthouse(ro, rd, horizon, hb, tL);
  if (lh.a > 0.0 && tL < hitT) { col = mix(col, lh.rgb, lh.a); if (lh.a > 0.5) hitT = tL; }

  // boats on the sea and gulls overhead, in front of whatever lies behind them
  float tB;
  vec4 bt = boat(ro, rd, uBoatA, horizon, tB);
  if (bt.a > 0.0 && tB < hitT) { col = mix(col, bt.rgb, bt.a); if (bt.a > 0.5) hitT = tB; }
  bt = boat(ro, rd, uBoatB, horizon, tB);
  if (bt.a > 0.0 && tB < hitT) { col = mix(col, bt.rgb, bt.a); if (bt.a > 0.5) hitT = tB; }
  gulls(ro, rd, col, hitT);
  // dolphins, a whale and a shark, now and then
  if (uFauna.z > 0.01) wildlife(ro, rd, horizon, col, hitT);

  // fog, rain haze and sea spray; lightning is bright enough to punch through it
  float fogA = fogAmount(ro, rd, hitT);
  vec3 fogC = fogColor(rd);
  col = mix(col, fogC, fogA);

  // waterspout in front of the scene, hazed by the air in between
  float tS;
  vec4 spout = waterspout(ro, rd, tS);
  if (spout.a > 0.0 && tS < hitT) col = mix(col, mix(spout.rgb, fogC, fogAmount(ro, rd, tS)), spout.a);

  // pale sun disc glowing through dust or thin fog
  if (rd.y > 0.0) {
    float hz = max(uPrecip.z, smoothstep(0.006, 0.02, uWeather.y) * (1.0 - gloom)) * (1.0 - smoothstep(0.7, 1.0, uSky.x));
    col += mix(vec3(1.0, 0.97, 0.92), vec3(1.0, 0.7, 0.45), uPrecip.z)
         * smoothstep(0.9993, 0.99965, dot(rd, SUN)) * hz * fogA * smoothstep(-0.03, 0.03, el) * 1.4;
  }

  // gusts of blown dust, spindrift and spray streaming past
  if (uWind.z > 0.01) col = mix(col, fogC * 1.08, veils(ro, rd, hitT) * uWind.z);

  col += boltCol * pow(1.0 - fogA, 0.3);
  col += lighthouseBeams(ro, rd, hb, hitT) * pow(1.0 - fogA, 0.4);

  // rainbow in the far rain once the sun breaks through
  if (uPrecip.w > 0.005) {
    float dark;
    vec3 bow = rainbow(rd, dark);
    float b = uPrecip.w * smoothstep(200.0, 2000.0, hitT) * (1.0 - fogA * 0.6);
    col = col * (1.0 - dark * 0.15 * b) + bow * SUN_COL * b * 0.4;
  }

  // falling rain, hail and snow, laid out by view angle so they stay put when you look around
  if (uWeather.x + uPrecip.x + uPrecip.y > 0.001) {
    vec2 wd = vec2(cos(uWave.z), sin(uWave.z));
    float side = dot(r.xz, wd) * uWater.w;           // crosswind as seen from here
    float elv = asin(clamp(rd.y, -1.0, 1.0));
    float az = atan(rd.x, rd.z);
    float px = 1.0 / (1.4 * uRes.y);                 // radians per pixel
    if (uWeather.x > 0.001) {
      vec2 a = vec2(az + elv * side * 0.02, elv);
      float amt = uWeather.x;
      float rn = rainLayer(a, 55.0, 0.10, 2.6, 0.30, 1.0, px, amt) * 0.6
               + rainLayer(a, 130.0, 0.05, 1.4, 0.40, 2.0, px, amt) * 0.4
               + rainLayer(a, 280.0, 0.025, 0.75, 0.50, 3.0, px, amt) * 0.25;
      col += (SKY_AMB * 0.6 + SUN_COL * 0.1) * vec3(0.85, 0.9, 1.0) * rn * amt;
    }
    if (uPrecip.y > 0.001) {
      // hail: short bright pellets falling hard
      vec2 a = vec2(az + elv * side * 0.012, elv);
      float amt = uPrecip.y;
      float hl = rainLayer(a, 45.0, 0.022, 3.0, 0.35, 5.0, px, amt)
               + rainLayer(a, 100.0, 0.012, 2.2, 0.45, 6.0, px, amt) * 0.6;
      col += (SKY_AMB * 1.1 + SUN_COL * 0.3) * hl * amt;
    }
    if (uPrecip.x > 0.001) {
      // snow drifts down slowly and gets driven sideways by strong wind
      vec2 a = vec2(az + elv * side * 0.06, elv);
      float amt = uPrecip.x;
      float fall = 1.0 + uWater.w * 0.05;
      float sn = snowLayer(a, 14.0, 1.8 * fall, 0.25 * amt, 7.0, px) * 0.9
               + snowLayer(a, 30.0, 2.2 * fall, 0.32 * amt, 8.0, px) * 0.8
               + snowLayer(a, 65.0, 2.5 * fall, 0.38 * amt, 9.0, px) * 0.6
               + snowLayer(a, 140.0, 2.8 * fall, 0.42 * amt, 10.0, px) * 0.45;
      col = mix(col, vec3(0.95, 0.97, 1.0) * (SKY_AMB * 0.9 + SUN_COL * 0.35), clamp(sn, 0.0, 1.0));
    }
  }

  col = aces(col * uSky.z);
  // subtle vignette
  vec2 q2 = gl_FragCoord.xy / uRes;
  col *= 0.88 + 0.12 * pow(16.0 * q2.x * q2.y * (1.0 - q2.x) * (1.0 - q2.y), 0.25);
  gl_FragColor = vec4(col, 1.0);
}
#endif
</script>

(() => {

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    if (texType !== gl.UNSIGNED_BYTE && gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
      texType = gl.UNSIGNED_BYTE; // half-float not renderable here: fall back

        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }
      document.body.classList.remove('shooting');
      flashEl.style.transition = 'none';
      flashEl.style.opacity = '0.7';
      requestAnimationFrame(() => { flashEl.style.transition = ''; flashEl.style.opacity = '0'; });
    }, 'image/png');
  }
  document.getElementById('photo').addEventListener('click', e => { e.stopPropagation(); takePhoto(); });

  // ---------- boats and seagulls ----------
  // a sloop a kilometre or two out and a container ship further off, both cruising past;
  // when one wanders too far it is replaced by another somewhere ahead of you
  const boats = [
    { x: 0, z: 0, hd: 0, speed: 3.5, dist: 700 },
    { x: 0, z: 0, hd: 0, speed: 7, dist: 2600 },
  ];
  function placeBoat(b) {
    let a, d;
    for (let tries = 0; tries < 8; tries++) { // somewhere ahead, clear of the island
      a = yaw + (Math.random() - 0.5) * 1.3;
      d = b.dist * (0.8 + Math.random() * 0.5);
      b.x = pos.x + Math.sin(a) * d;
      b.z = pos.z + Math.cos(a) * d;
      if (Math.hypot(b.x - -500, b.z - 1500) > 750) break;
    }
    b.hd = a + Math.PI / 2 + (Math.random() - 0.5) * 1.2 + (Math.random() < 0.5 ? Math.PI : 0); // mostly crossing
  }
  boats.forEach(placeBoat);
  // a loose flock circling ahead, slowly following wherever you look
  const birds = Array.from({ length: 6 }, () => ({
    a: Math.random() * 6.28, r: 20 + Math.random() * 55, h: 14 + Math.random() * 28,
    w: (0.12 + Math.random() * 0.15) * (Math.random() < 0.5 ? -1 : 1), ph: Math.random() * 20,
  }));
  const birdBuf = new Float32Array(24);
  let flockX = 0, flockZ = 80, boatAmt = 0, birdAmt = 0;

  // ---------- wildlife ----------
  // now and then a pod of dolphins leaps past, a whale breaches or blows further out, or a
  // shark's fin cuts by. Each turns up somewhere in front of you, more often with more life;
  // the shader plays out each event from its clock (t, -1 when nothing is happening).
  const DOLPHIN_DUR = 10, WHALE_DUR = 13, SHARK_DUR = 18;
  const pod = { x: 0, z: 0, hd: 0, t: -1, n: 3, next: 15 + Math.random() * 25 };
  const whale = { x: 0, z: 0, hd: 0, t: -1, kind: 0, next: 40 + Math.random() * 50 };
  const shark = { x: 0, z: 0, hd: 0, t: -1, up: 0, seed: 0, next: 30 + Math.random() * 40 };
  let faunaAmt = 0;
  // somewhere ahead within the view, clear of the island, heading across it
  function placeAhead(o, dMin, dMax, spread) {
    let a;
    for (let tries = 0; tries < 8; tries++) {
      a = yaw + (Math.random() - 0.5) * spread;
      const d = dMin + Math.random() * (dMax - dMin);
      o.x = pos.x + Math.sin(a) * d;
      o.z = pos.z + Math.cos(a) * d;
      if (Math.hypot(o.x - ISLE.x, o.z - ISLE.z) > ISLE.r + 250) break;
    }
    o.hd = -a + (Math.random() < 0.5 ? Math.PI : 0) + (Math.random() - 0.5) * 0.6;
  }

  // ---------- sound: all synthesized, no audio files ----------
  const soundBtn = document.getElementById('sound');
  const audio = { ctx: null };
  function startAudio() {
    if (S.muted) return;
    if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const master = ctx.createGain();
    master.gain.value = 0;
    const muffle = ctx.createBiquadFilter(); // everything sounds dull and distant underwater
    muffle.type = 'lowpass';
    muffle.frequency.value = 20000;
    master.connect(muffle);
    muffle.connect(ctx.destination);
    audio.muffle = muffle;
    // four seconds of white noise: the raw material for surf, wind, rain and thunder
    const buf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const layer = (rate, type, freq, q) => {
      const s = ctx.createBufferSource();
      s.buffer = buf; s.loop = true; s.playbackRate.value = rate;
      const f = ctx.createBiquadFilter();
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain();
      g.gain.value = 0;
      s.connect(f); f.connect(g); g.connect(master);
      s.start();
      return { f, g };
    };
    Object.assign(audio, {
      ctx, master, buf,
      surf: layer(1, 'lowpass', 400, 0.7),      // deep roll of the swell
      hiss: layer(0.8, 'bandpass', 2500, 0.6),  // fizz of breaking crests
      wind: layer(1.3, 'bandpass', 500, 1.5),
      rain: layer(1, 'highpass', 2200, 0.5),
    });
  }
  function updateAudio(t, dt) {
    if (!audio.ctx) return;
    const now = audio.ctx.currentTime, k = 0.3;
    audio.master.gain.setTargetAtTime(S.muted ? 0 : C.volume, now, 0.4);
    audio.muffle.frequency.setTargetAtTime(underwater ? 380 : 20000, now, 0.15);
    const near = Math.max(0.15, 1 - (pos.y - 2) / 60);            // the sea fades as you climb
    const sea = 0.3 + 0.7 * smooth(3, 22, C.windSpeed);
    const swell = 0.55 + 0.45 * Math.sin(t * 0.7) * Math.sin(t * 0.23 + 1.3);
    audio.surf.g.gain.setTargetAtTime(0.55 * sea * swell * near, now, k);
    audio.surf.f.frequency.setTargetAtTime(220 + 380 * swell * sea, now, k);
    audio.hiss.g.gain.setTargetAtTime(0.05 * sea * Math.max(0, swell - 0.35) * near * (0.4 + C.foam * 0.5), now, k);
    const w = smooth(4, 24, C.windSpeed);
    const gust = 0.65 + 0.35 * Math.sin(t * 1.3) * Math.sin(t * 0.37 + 2.0);
    audio.wind.g.gain.setTargetAtTime(0.4 * w * w * gust, now, k);
    audio.wind.f.frequency.setTargetAtTime(280 + 750 * w * gust, now, k);
    audio.rain.g.gain.setTargetAtTime(0.22 * Math.min(1, C.rain + C.hail * 1.3 + C.snow * 0.08), now, k);
    // gulls call now and then while they are around
    if (birdAmt > 0.3 && (gullTimer -= dt) <= 0) {
      gullTimer = 5 + Math.random() * 14;
      gullCall(birdAmt);
    }
  }
  let gullTimer = 3;
  function gullCall(level) {
    const ctx = audio.ctx;
    let t0 = ctx.currentTime;
    const out = ctx.createGain();
    out.gain.value = 0.05 * level;
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (pan) { pan.pan.value = Math.random() * 1.6 - 0.8; out.connect(pan); pan.connect(audio.master); }
    else out.connect(audio.master);
    const n = 2 + Math.floor(Math.random() * 4);
    const f0 = 1150 + Math.random() * 400;
    for (let i = 0; i < n; i++) {
      // "kyow": a quick rise then a falling, nasal glide
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 0.7, t0);
      o.frequency.linearRampToValueAtTime(f0, t0 + 0.05);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.55, t0 + 0.3);
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 2.2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(1, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
      o.connect(bp); bp.connect(g); g.connect(out);
      o.start(t0); o.stop(t0 + 0.35);
      t0 += 0.2 + Math.random() * 0.18;
    }
  }
  // thunder rolls in after the flash: a sharp crack for close strikes, then a long rumble
  function thunder(dist, power) {
    if (!audio.ctx) return;
    const ctx = audio.ctx;
    const t0 = ctx.currentTime + dist / 900;
    const s = ctx.createBufferSource();
    s.buffer = audio.buf; s.loop = true; s.playbackRate.value = 0.45;
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(dist < 4000 ? 1400 : 500, t0);
    f.frequency.exponentialRampToValueAtTime(110, t0 + 1.8);
    const g = ctx.createGain();
    const v = Math.min(1.2, power * 3500 / dist);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.06);
    g.gain.setTargetAtTime(v * 0.45, t0 + 0.15, 0.4);
    g.gain.setTargetAtTime(0.0001, t0 + 1.4, 1.3);
    s.connect(f); f.connect(g); g.connect(audio.master);
    s.start(t0); s.stop(t0 + 8);
  }
  // a whale crashing back down, or its blow, heard across the water a moment later
  function whaleSound(dist, crash) {
    if (!audio.ctx) return;
    const ctx = audio.ctx;
    const t0 = ctx.currentTime + dist / 340;
    const s = ctx.createBufferSource();
    s.buffer = audio.buf; s.loop = true; s.playbackRate.value = crash ? 0.5 : 0.9;
    const f = ctx.createBiquadFilter();
    f.type = crash ? 'lowpass' : 'bandpass';
    f.frequency.setValueAtTime(crash ? 900 : 700, t0);
    f.frequency.exponentialRampToValueAtTime(crash ? 150 : 400, t0 + (crash ? 2 : 1.2));
    const g = ctx.createGain();
    const v = Math.min(0.8, (crash ? 60 : 18) / dist);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (crash ? 0.05 : 0.15));
    g.gain.setTargetAtTime(0.0001, t0 + (crash ? 0.3 : 0.5), crash ? 0.7 : 0.35);
    s.connect(f); f.connect(g); g.connect(audio.master);
    s.start(t0); s.stop(t0 + 4);
  }
  function markSound() { soundBtn.textContent = S.muted ? '🔇' : '🔊'; }
  function toggleSound() {
    S.muted = !S.muted;
    save();
    markSound();
    if (!S.muted) startAudio();
  }
  markSound();
  soundBtn.addEventListener('click', e => { e.stopPropagation(); toggleSound(); });
  // browsers only allow sound after you interact with the page
  for (const ev of ['pointerdown', 'keydown']) window.addEventListener(ev, startAudio, { passive: true });

  const start = performance.now();
  let last = start;
  let cloudT = 0;
  function frame(now) {
    const rawDt = (now - last) / 1000;
    const dt = Math.min(rawDt, 0.1);
    last = now;
    if (rawDt < 1) adaptResolution(rawDt); // ignore pauses (hidden tab)
    yaw += (tYaw - yaw) * 0.08;
    pitch += (tPitch - pitch) * 0.08;

    // ease the scene toward the chosen settings
    for (const k in DEFAULTS) {
      if (k === 'windDir') { C[k] = S[k]; continue; }
      let diff = S[k] - C[k];
      if (k === 'sunAzim') diff = ((diff % 360) + 540) % 360 - 180; // shortest way round
      C[k] += diff * (1 - Math.exp(-dt * rate[k]));
    }

    // waves: stronger wind -> more energy in longer, taller waves
    const amp = 0.1 * Math.pow(C.windSpeed / 5, 2);
    const kPeak = 9.5 / (C.windSpeed * C.windSpeed);
    const minY = 0.6 + amp * 2.2;

    const fwd = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
    const side = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
    const up = (keys.has('KeyE') || keys.has('Space') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0);
    const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? 18 : 5;
    const fx = Math.sin(yaw), fz = Math.cos(yaw);   // horizontal forward
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);  // horizontal right
    const ease = 1 - Math.exp(-dt * 4);
    vel.x += ((fx * fwd + rx * side) * speed - vel.x) * ease;
    vel.z += ((fz * fwd + rz * side) * speed - vel.z) * ease;
    vel.y += (up * speed * 0.6 - vel.y) * ease;
    pos.x += vel.x * dt;
    pos.z += vel.z * dt;
    pos.y += vel.y * dt + wheelLift * ease;
    wheelLift -= wheelLift * ease;
    // the surface is a one-way door: pass straight through the wave band, stop above the sand
    const below = 0.5 + amp * 1.6;
    if (pos.y < minY && pos.y > -below) pos.y = vel.y < 0 ? -below : minY;
    // dive no deeper than the sand (the shader keeps the bottom at least 2.5 m below you)
    pos.y = Math.max(-Math.max(floorDepthJS(pos.x, pos.z) * C.depth - 0.6, below + 0.5), Math.min(MAX_Y, pos.y));
    const ground = isleHeightJS(pos.x, pos.z);
    if (ground > -1) pos.y = Math.max(pos.y, ground + 3);
    underwater = pos.y < 0;

    // lightning strikes
    if (C.lightning > 0.02 && strikeT < 0) {
      nextStrike -= dt * C.lightning;
      if (nextStrike <= 0) {
        strikeT = 0;
        nextStrike = 3 + Math.random() * 9;
        const az = yaw + (Math.random() - 0.5) * 1.8;
        const d = 2500 + Math.random() * 5000;
        bolt.x = pos.x + Math.sin(az) * d;
        bolt.z = pos.z + Math.cos(az) * d;
        bolt.vis = Math.random() < 0.75 ? 1 : 0; // some strikes stay hidden in the clouds
        bolt.seed = Math.random() * 100;
        bolt.power = 0.6 + Math.random() * 0.6;
        thunder(d, bolt.power);
      }
    }
    let flash = 0;
    if (strikeT >= 0) {
      for (const [t0, a] of PULSES) if (strikeT >= t0) flash += a * Math.exp(-(strikeT - t0) * 18);
      flash *= bolt.power;
      strikeT += dt;
      if (strikeT > 1.2) strikeT = -1;
    }

    // weather: fog/rain haze/spray density and how much the clouds darken everything
    const fogRho = C.fog * C.fog * 0.03 + C.rain * 0.004 + smooth(10, 20, C.windSpeed) * 0.0015
                 + smooth(18, 25, C.windSpeed) * 0.004 + C.snow * 0.007 + C.hail * 0.003 + C.dust * C.dust * 0.028;
    const gloom = Math.min(0.92, smooth(0.55, 1, C.clouds) * 0.5 + C.rain * 0.3 + C.lightning * 0.15 + C.fog * 0.15
                 + C.snow * 0.2 + C.hail * 0.25 + C.dust * 0.35);
    // blowing dust, spindrift in a blizzard, spume in a hurricane, wisps of fog
    const veil = Math.min(1, C.dust * 0.75 + C.snow * smooth(8, 16, C.windSpeed) * 0.6
                 + smooth(17, 25, C.windSpeed) * 0.45 + C.fog * 0.2);
    const wr = C.windDir * Math.PI / 180;
    windOff.x = (windOff.x + Math.cos(wr) * C.windSpeed * dt) % 20000;
    windOff.z = (windOff.z + Math.sin(wr) * C.windSpeed * dt) % 20000;

    // a rainbow shows up while the air is still wet and the sun comes out
    wet = Math.max(C.rain + C.hail * 0.5, wet * Math.exp(-dt / 45));
    const bow = smooth(0.03, 0.2, wet) * (1 - smooth(0.4, 0.9, C.rain)) * (1 - smooth(0.25, 0.7, gloom))
              * (1 - C.snow) * (1 - C.dust) * smooth(0, 4, C.sunElev);

    // the waterspout forms ahead of you, lowers slowly from the cloud, then drifts downwind
    if (C.spout > 0.01) {
      if (!spout.placed) {
        spout.placed = true;
        spout.x = pos.x + Math.sin(yaw + 0.2) * 3200;
        spout.z = pos.z + Math.cos(yaw + 0.2) * 3200;
      }
      spout.x += Math.cos(wr) * 3 * dt;
      spout.z += Math.sin(wr) * 3 * dt;
    } else spout.placed = false;
    spout.grow += Math.max(-0.2 * dt, Math.min(0.07 * dt, C.spout - spout.grow));

    if (S.auto && (autoTimer -= dt) <= 0) { autoTimer = AUTO_EVERY; autoStep(); }
    if (real.on && (real.timer -= dt) <= 0) { real.timer = 20; updateRealSky(); }

    // boats stay in port in a gale; gulls only fly in daylight and decent weather
    boatAmt = C.life * (1 - smooth(15, 21, C.windSpeed));
    birdAmt = C.life * smooth(0, 8, C.sunElev) * (1 - smooth(0.25, 0.6, C.rain + C.snow + C.hail + C.dust))
            * (1 - smooth(13, 19, C.windSpeed)) * (1 - C.fog * 0.7);
    for (const b of boats) {
      b.x += Math.cos(b.hd) * b.speed * dt;
      b.z += Math.sin(b.hd) * b.speed * dt;
      const d = Math.hypot(b.x - pos.x, b.z - pos.z);
      if (d > b.dist * 2.5 || d < 200 || Math.hypot(b.x + 500, b.z - 1500) < 650) placeBoat(b);
    }
    const fe = 1 - Math.exp(-dt * 0.15);
    flockX += (pos.x + Math.sin(yaw) * 90 - flockX) * fe;
    flockZ += (pos.z + Math.cos(yaw) * 90 - flockZ) * fe;
    birds.forEach((b, i) => {
      b.a += b.w * dt;
      b.ph += dt;
      // bursts of flapping between long glides
      const flap = (b.ph * 0.22) % 1 < 0.35 ? Math.sin(b.ph * 9) * 0.8 + 0.2 : 0.28 + 0.05 * Math.sin(b.ph * 2);
      birdBuf.set([flockX + Math.cos(b.a) * b.r, b.h + Math.sin(b.ph * 0.4) * 4, flockZ + Math.sin(b.a) * b.r, flap], i * 4);
    });

    // wildlife stays away in a gale, and only turns up while you are at the surface to see it
    faunaAmt = C.life * (1 - smooth(13, 19, C.windSpeed));
    const spawn = underwater ? 0 : faunaAmt;
    if (pod.t >= 0) { pod.t += dt; if (pod.t > DOLPHIN_DUR) pod.t = -1; }
    else if ((pod.next -= dt * spawn) <= 0) {
      pod.next = 25 + Math.random() * 45;
      placeAhead(pod, 35, 75, 0.7);
      pod.n = 2 + Math.floor(Math.random() * 3);
      pod.t = 0;
    }
    if (whale.t >= 0) {
      const t0 = whale.t, d = Math.hypot(whale.x - pos.x, whale.z - pos.z);
      whale.t += dt;
      const at = x => t0 < x && whale.t >= x;
      if (whale.kind === 0 ? at(3.6) : at(3.0) || at(5.5)) whaleSound(d, whale.kind === 0);
      if (whale.t > WHALE_DUR) whale.t = -1;
    } else if ((whale.next -= dt * spawn) <= 0) {
      whale.next = 50 + Math.random() * 70;
      placeAhead(whale, 140, 260, 0.8);
      whale.kind = Math.random() < 0.5 ? 0 : 1;
      whale.t = 0;
    }
    if (shark.t >= 0) {
      shark.t += dt;
      shark.hd += Math.sin(shark.t * 0.4 + shark.seed) * 0.25 * dt;   // weaving lazily
      shark.x += Math.cos(shark.hd) * 2.2 * dt;
      shark.z += Math.sin(shark.hd) * 2.2 * dt;
      shark.up = smooth(0, 2, shark.t) * (1 - smooth(SHARK_DUR - 2.5, SHARK_DUR, shark.t));
      if (shark.t > SHARK_DUR) { shark.t = -1; shark.up = 0; }
    } else if ((shark.next -= dt * spawn) <= 0) {
      shark.next = 35 + Math.random() * 50;
      placeAhead(shark, 22, 45, 0.6);
      shark.x -= Math.cos(shark.hd) * 20;   // it swims through the spot halfway through
      shark.z -= Math.sin(shark.hd) * 20;
      shark.seed = Math.random() * 6;
      shark.t = 0;
    }

    updateAudio((now - start) / 1000, dt);

    cloudT += dt * C.cloudSpeed;
    const el = C.sunElev * Math.PI / 180, az = C.sunAzim * Math.PI / 180;

    const setCommon = U => {
      gl.uniform2f(U.uRes, canvas.width, canvas.height);
      gl.uniform1f(U.uTime, (now - start) / 1000);
      gl.uniform2f(U.uLook, yaw, pitch);
      gl.uniform3f(U.uPos, pos.x, pos.y, pos.z);
      gl.uniform3f(U.uSun, Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
      gl.uniform4f(U.uWave, amp, kPeak, C.windDir * Math.PI / 180, C.choppy);
      gl.uniform4f(U.uWater, C.foam, C.murk, C.depth, C.windSpeed);
      gl.uniform3f(U.uSky, C.clouds, cloudT, C.exposure);
      gl.uniform4f(U.uWeather, C.rain, fogRho, gloom, flash);
      gl.uniform4f(U.uBolt, bolt.x, bolt.z, bolt.vis, bolt.seed);
      gl.uniform4f(U.uPrecip, C.snow, C.hail, C.dust, bow);
      gl.uniform4f(U.uSpout, spout.x, spout.z, spout.grow, 0);
      gl.uniform4f(U.uWind, windOff.x, windOff.z, veil, 0);
      gl.uniform4f(U.uNight, C.aurora, C.glow, C.meteors, 0);
      gl.uniform4f(U.uStars, C.moon, C.stars, C.planes, C.sats);
      gl.uniform1i(U.uTex, 0);
      gl.uniform4f(U.uBoatA, boats[0].x, boats[0].z, boats[0].hd, 0);
      gl.uniform4f(U.uBoatB, boats[1].x, boats[1].z, boats[1].hd, 1);
      gl.uniform4fv(U.uBirds, birdBuf);
      gl.uniform2f(U.uLife, boatAmt, birdAmt);
      gl.uniform4f(U.uDolphin, pod.x, pod.z, pod.hd, pod.t);
      gl.uniform4f(U.uWhale, whale.x, whale.z, whale.hd, whale.t);
      gl.uniform4f(U.uShark, shark.x, shark.z, shark.hd, shark.up);
      gl.uniform4f(U.uFauna, pod.n, whale.kind, faunaAmt, C.life);
      gl.uniform4f(U.uMoon, real.moon[0], real.moon[1], real.moon[2], real.on ? 1 : 0);
      gl.uniform3f(U.uMoonSun, real.sun[0], real.sun[1], real.sun[2]);
      gl.uniformMatrix3fv(U.uSkyRot, false, real.on ? real.skyRot : DEFAULT_SKY);
    };
    gl.activeTexture(gl.TEXTURE0);

    // a photo is rendered at full resolution, with the clouds settled over many passes
    const shooting = photoPending;
    let oldScale = renderScale;
    if (shooting) { renderScale = 1; resize(); }

    // pass 1: clouds at half resolution, blended into last frame's clouds
    gl.useProgram(cloudProg.p);
    setCommon(cloudProg.loc);
    gl.uniform2f(cloudProg.loc.uCloudRes, cloudW, cloudH);
    for (let i = 0; i < (shooting ? 24 : 1); i++) {
      if (i > 0) { cur = 1 - cur; histOk = true; frameNo++; }
      gl.uniform4f(cloudProg.loc.uCloudView, i > 0 ? yaw : prevLook[0], i > 0 ? pitch : prevLook[1], frameNo % 997, histOk ? 1 : 0);
      gl.bindTexture(gl.TEXTURE_2D, targets[1 - cur].tex);
      gl.bindFramebuffer(gl.FRAMEBUFFER, targets[cur].fb);
      gl.viewport(0, 0, cloudW, cloudH);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // pass 2: the full scene, reading this frame's clouds
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(mainProg.p);
    setCommon(mainProg.loc);
    gl.bindTexture(gl.TEXTURE_2D, targets[cur].tex);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (shooting) {
      photoPending = false;
      savePhoto();
      renderScale = oldScale;
      resize();
    }
    cur = 1 - cur;
    histOk = true;
    prevLook = [yaw, pitch];
    frameNo++;

    fpsFrames++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
      fpsEl.textContent = Math.round(fpsFrames / fpsTime) + ' fps · ' + Math.round(renderScale * 100) + '%';
      fpsFrames = 0; fpsTime = 0;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
