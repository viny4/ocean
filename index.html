<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean View</title>
<meta name="description" content="A real-time ocean in your browser: wave spectrum water, volumetric clouds, 21 weather presets, a real night sky, an underwater dive and a lighthouse island. One HTML file, WebGL.">
<meta name="theme-color" content="#0a3b5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a3b5c'/%3E%3Ccircle cx='40' cy='24' r='10' fill='%23ffc94d'/%3E%3Cpath d='M4 40c7 0 7-5 14-5s7 5 14 5 7-5 14-5 7 5 14 5v24H4z' fill='%235fd4e0'/%3E%3Cpath d='M4 50c7 0 7-5 14-5s7 5 14 5 7-5 14-5 7 5 14 5v14H4z' fill='%231a7fa8'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:url" content="https://viny4.github.io/ocean/">
<meta property="og:title" content="Ocean View">
<meta property="og:description" content="A real-time ocean in your browser: waves, clouds, 21 kinds of weather, a real night sky, an underwater dive and a lighthouse island.">
<meta property="og:image" content="https://viny4.github.io/ocean/docs/golden-hour.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ocean View">
<meta name="twitter:description" content="A real-time ocean in your browser: waves, clouds, 21 kinds of weather, a real night sky, an underwater dive and a lighthouse island.">
<meta name="twitter:image" content="https://viny4.github.io/ocean/docs/golden-hour.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="hint">W A S D / arrows to move · drag to look · E / Q up &amp; down (Q at the surface to dive) · Shift faster · C camera · H settings · M sound · P photo</div>
<div id="touch">
  <div id="stick" aria-label="Move"><div id="knob"></div></div>
  <button id="fast" class="tbtn" aria-pressed="false" aria-label="Move faster">⚡</button>
  <button id="rise" class="tbtn" aria-label="Rise">▲</button>
  <button id="dive" class="tbtn" aria-label="Dive">▼</button>
</div>
<button id="cam" aria-label="Camera mode" title="Camera mode (C)">🎥</button>
<button id="photo" aria-label="Save a photo" title="Save a photo (P)">📷</button>
<button id="sound" aria-label="Sound on or off" title="Sound (M)">🔊</button>
<button id="gear" aria-label="Settings" title="Settings (H)">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
    <circle cx="9" cy="6" r="2" fill="#123"/><circle cx="15" cy="12" r="2" fill="#123"/><circle cx="7" cy="18" r="2" fill="#123"/>
  </svg>
</button>
<div id="panel" class="hidden">
  <div class="head"><h2>Ocean settings</h2><span id="fps"></span><button class="x" id="close" aria-label="Close">×</button></div>
  <div class="section">Weather</div>
  <div class="presets" id="weather"></div>
  <button id="auto" class="wide" aria-pressed="false" title="Weather changes by itself every minute or so">🔄 Live weather</button>
  <div class="section">Time of day</div>
  <div class="presets" id="times"></div>
  <button id="realsky" class="wide" aria-pressed="false" title="Sun, moon and stars where they really are, for your location and time">📍 Real sky now</button>
  <div id="realinfo" hidden></div>
  <div class="section">Climate</div>
  <div class="presets" id="climates"></div>
  <div class="section">Camera</div>
  <div class="presets four" id="cams"></div>
  <div class="section">Quality</div>
  <div class="presets four" id="quality"></div>
  <div id="sliders"></div>
  <button id="reset" class="wide">Reset to default</button>
</div>

<script src="js/shaders.js"></script>
<script src="js/stars.js"></script>
<script src="js/app.js"></script>
</body>
</html>
